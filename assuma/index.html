function home(){return `<div class="wrap fade"><section class="hero"><div class="hero-copy"><span class="eyebrow">Uma experiência de Rarí Fávaro</span><h1>Tem algo pedindo<br>um <em>novo olhar.</em></h1><p>Às vezes, você sabe o que sente.<br>Só ainda não sabe por onde começar.<br>Vamos encontrar uma primeira pergunta?</p><button class="primary" data-action="start">Começar minha experiência <span class="arrow">↗</span></button><div class="tiny hero-note">${icon('lock')} No seu tempo. Com espaço para você.</div></div><div class="portal" aria-hidden="true"><span class="orbital-caption">UM ENCONTRO COM O SEU MOMENTO</span><div class="orbit"></div><div class="orbit two"></div><div class="orbit three"></div><div class="hero-card left">${icon('back-art')}</div><div class="hero-card right">${icon('back-art')}</div><div class="hero-card center">${icon('sun-art')}<span>UM NOVO OLHAR</span></div><span class="portal-label">Escuta · Símbolo · Direção</span></div></section><div class="chapter-line"><span>Três perguntas. Um primeiro caminho.</span><span>Tarot · Presença · Escolha</span></div><section class="section" id="como-funciona"><div class="section-heading"><div><span class="eyebrow">A experiência ASSUMA</span><h2>Antes da resposta,<br>espaço para a sua história.</h2></div><p>Uma conversa para organizar o que você está vivendo. Os símbolos abrem a reflexão. O aprofundamento acontece com Rarí, em um atendimento humano.</p></div><div class="steps-grid"><article class="step-card"><span class="step-no">01</span><h3>Traga o que te move.</h3><p>Escolha uma área da vida e conte o que está acontecendo. Você pode escrever ou testar a gravação de voz.</p></article><article class="step-card"><span class="step-no">02</span><h3>Encontre os símbolos.</h3><p>Percorra três perguntas e escolha suas cartas. Um convite para observar a situação por outros ângulos.</p></article><article class="step-card"><span class="step-no">03</span><h3>Continue com Rarí.</h3><p>Revise sua síntese e conheça o próximo passo para uma consulta de Tarot, com escuta e aprofundamento.</p></article></div><p class="tiny center-note">Nesta prévia, a conversa segue um roteiro demonstrativo. A agente de IA será conectada após a aprovação do manual de Rarí.</p></section><section id="rari" class="about-panel"><div class="about-seal"><div class="monogram" aria-hidden="true">Rf</div><span class="eyebrow">Quem te acompanha</span></div><div><h2>O portal abre a conversa.<br>Eu encontro você do outro lado.</h2><p>Sou Rarí Fávaro, tarólogo, cartomante e terapeuta vibracional. Meu trabalho reúne escuta e leitura simbólica para investigar questões, escolhas e caminhos.</p><p style="margin-top:13px">Depois desse primeiro olhar, seguimos pelo WhatsApp. Na consulta, avaliamos juntos o que faz sentido aprofundar no Tarot e, quando pertinente, na radiestesia e na radiônica.</p><div class="signature">Rarí Fávaro</div><p class="tiny" style="margin-top:5px">Tarot · Baralho Cigano · Terapias vibracionais</p></div></section><section class="section" id="duvidas"><div class="faq"><h2>Antes de começar.</h2><details><summary>Isso já é uma consulta com o Rarí?</summary><p>Esta é uma experiência inicial. O atendimento com Rarí acontece depois, pelo WhatsApp, com condições e valores combinados diretamente. O protótipo não cobra nem confirma agendamentos.</p></details><details><summary>Quem conversa comigo aqui?</summary><p>Nesta versão, você testa um roteiro que varia conforme a área escolhida e algumas palavras das respostas escritas. Ele simula a futura agente de IA e não realiza uma leitura autoral de Rarí.</p></details><details><summary>Preciso usar o microfone?</summary><p>Você pode responder por texto em toda a experiência. Se optar por gravar, o áudio fica temporariamente neste navegador e pode ser ouvido antes de continuar. A transcrição e a compreensão automática de voz ainda não estão conectadas.</p></details><details><summary>As cartas dizem o que vai acontecer?</summary><p>Os símbolos são convites à reflexão, com exemplos de sentidos tradicionais ainda sujeitos à revisão de Rarí. Eles não garantem acontecimentos, revelam pensamentos de outras pessoas ou substituem avaliação médica ou psicológica.</p></details><details><summary>O que acontece com as minhas respostas?</summary><p>Nesta prévia, as respostas ficam apenas na memória desta aba. Nenhum relatório é enviado automaticamente. Ao sair e apagar a experiência, ou recarregar a página, elas são descartadas. Você pode baixar uma cópia se quiser.</p></details></div></section><section class="bottom-invite"><span class="eyebrow">Seu momento merece escuta</span><h2>Por onde você<br>quer começar?</h2><button class="primary" data-action="start">Entrar no portal <span class="arrow">↗</span></button></section></div>`;}
function areaScreen(){return `<div class="app-shell fade">${sessionTop(1,'Seu ponto de partida')}<div class="screen-heading"><span class="eyebrow">01 · Escolha uma área</span><h1>O que pede seu<br>olhar hoje?</h1><p>Comece pelo que mais está presente.<br>Você não precisa resolver tudo de uma vez.</p></div><div class="area-grid">${Object.entries(AREAS).map(([id,a])=>`<button class="area" data-action="area" data-area="${id}">${icon(a.icon,'area-icon')}<span class="area-arrow">↗</span><strong>${a.label}</strong><small>${a.desc}</small></button>`).join('')}</div><p class="tiny area-foot">Uma escolha para abrir a conversa. Não para limitar você.</p></div>`;}
function consentScreen(){return `<div class="app-shell fade">${sessionTop(2,'Antes de conversar')}<div class="screen-heading"><span class="eyebrow">02 · Um acordo de cuidado</span><h1>Sua história.<br>No seu tempo.</h1><p>Você escolheu ${esc(AREAS[state.area].label.toLowerCase())}. Antes de começar, veja como esta prévia funciona.</p></div><form id="consent-form" class="consent-panel"><label class="field-label" for="first-name">Como você quer ser chamado? <span style="letter-spacing:0;text-transform:none">(opcional)</span></label><input class="field" id="first-name" maxlength="40" placeholder="Seu primeiro nome ou apelido" autocomplete="off" value="${esc(state.name)}"><div class="notice"><strong>Você vai testar uma conversa simulada por roteiro.</strong><br>A futura agente será uma IA, identificada como tal, orientada por um manual aprovado por Rarí. Esta prévia não tem IA ou transcrição conectadas.</div><label class="check-row"><input id="consent-experience" type="checkbox" ${state.consent.experience?'checked':''} required><span>Entendi a demonstração e autorizo o uso temporário das minhas respostas nesta aba para montar minha síntese.<small>Sem envio externo. Evite inserir documentos, informações sensíveis ou dados que identifiquem outras pessoas.</small></span></label><label class="check-row"><input id="consent-voice" type="checkbox" ${state.consent.voice?'checked':''}><span>Quero habilitar a opção de gravar minha voz.<small>Opcional. Gravação local, sem transcrição automática ou upload. O navegador pedirá acesso ao microfone apenas quando eu tocar em gravar.</small></span></label><p class="tiny" style="margin-top:21px">O compartilhamento com Rarí será uma escolha separada ao final. <button class="text-button" type="button" data-action="privacy">Ler os detalhes</button></p><button class="primary" type="submit" id="begin-session" ${state.consent.experience?'':'disabled'}>Começar minha conversa <span class="arrow">↗</span></button></form><p class="tiny center-note">Você pode sair e apagar a experiência a qualquer momento.</p></div>`;}
function signals(text){const t=text.toLocaleLowerCase('pt-BR');if(/medo|receio|insegur|ansied/.test(t))return 'uncertainty';if(/repete|repeti|sempre|de novo|mesmo padr/.test(t))return 'repeat';if(/decid|decis|escolh|dúvida|duvida/.test(t))return 'choice';if(/limite|cansa|exaust|sobrecarg|esgot/.test(t))return 'limit';return 'open';}
function questionFor(i){const area=AREAS[state.area],first=state.answers[0],second=state.answers[1];if(i===0)return {lead:state.name?`${state.name}, vamos começar pelo que você está vivendo.`:'Vamos começar pelo que você está vivendo.',q:area.q};if(i===1){if(first.type==='audio')return {lead:'Seu áudio ficou registrado neste navegador. A compreensão automática de voz ainda não está conectada; vamos seguir com uma pergunta da área escolhida.',q:`Ao olhar para ${area.focus}, o que mais merece atenção agora?`};const s=signals(first.text);const qs={uncertainty:'Você mencionou uma preocupação. O que de fato aconteceu e o que ainda é um receio seu?',repeat:'Você descreveu algo que parece se repetir. Em qual situação concreta isso ficou mais evidente?',choice:'Você trouxe uma escolha. Quais possibilidades estão na mesa e o que pesa em cada uma?',limit:'Você trouxe algo que parece pesar. O que mais exige de você e que limite gostaria de preservar?',open:`Olhando para ${area.focus}, o que você sente que ainda precisa compreender?`};return {lead:'Vamos dar um pouco mais de contorno ao que você trouxe.',q:qs[s]};}if(second?.type==='text'&&signals(second.text)==='limit')return {lead:'Para fechar, vamos aproximar essa reflexão de uma escolha sua.',q:'Que limite você quer conseguir expressar com mais clareza e levar para uma consulta?'};return {lead:'Uma última pergunta. A ideia é sair com algo que mereça ser aprofundado.',q:area.next};}
function pastAnswers(){return state.answers.length?`<details class="past-answers"><summary>Rever ${state.answers.length===1?'minha resposta anterior':'minhas respostas anteriores'}</summary>${state.answers.map((a,i)=>`<div class="past-item"><strong>${i+1}. ${esc(a.question)}</strong><p>${a.type==='text'?esc(a.text):`Áudio local · ${a.duration}s · sem transcrição`}</p>${a.type==='audio'?`<audio controls preload="metadata" src="${a.url}" style="width:100%;height:34px;margin-top:9px"></audio>`:''}</div>`).join('')}</details>`:'';}
function conversationScreen(){const q=questionFor(state.question);return `<div class="app-shell fade">${sessionTop(3,AREAS[state.area].label)}<div class="stage-heading"><span class="agent-badge"><span class="agent-symbol">a</span>Agente ASSUMA · simulação</span><span>Pergunta ${state.question+1} de 3</span></div><section class="agent-panel"><div class="mini-orb" aria-hidden="true"></div><span class="eyebrow">${['O que está presente','O que pede atenção','O próximo passo'][state.question]}</span><p class="lead-in" style="margin-top:12px">${esc(q.lead)}</p><h1 class="question">${esc(q.q)}</h1><div class="question-tools"><button class="small-btn" data-action="listen">${icon('sound')}Ouvir pergunta</button><span class="tiny" style="font-size:9px">Voz local, quando disponível</span></div></section><section class="answer-panel" aria-label="Sua resposta"><div class="input-tabs" role="group" aria-label="Modo de resposta"><button data-action="text-mode" class="${voiceMode?'':'active'}" aria-pressed="${!voiceMode}">${icon('text')}Escrever</button><button data-action="voice-mode" class="${voiceMode?'active':''}" aria-pressed="${voiceMode}">${icon('mic')}Falar</button></div>${voiceMode?voicePanel():`<form id="answer-form"><label class="field-label" for="answer">Sua resposta</label><textarea id="answer" class="field" maxlength="2400" placeholder="Pode contar do seu jeito. Não precisa organizar tudo antes.">${esc(state.draft)}</textarea><div class="answer-bottom"><span class="tiny" id="char-count">${state.draft.length}/2400 · Só nesta aba</span><button id="send-answer" class="primary" type="submit" ${state.draft.trim()?'':'disabled'}>Escolher uma carta <span class="arrow">→</span></button></div></form>`}</section>${pastAnswers()}<p class="session-hint">Roteiro demonstrativo. As perguntas variam por área e palavras do texto; áudios não são interpretados nesta versão.</p></div>`;}
function voicePanel(){return `<div class="voice-panel">${!state.consent.voice?`<p class="voice-label">Você escolhe se quer falar.</p><p class="tiny">Ao habilitar, você autoriza apenas uma gravação temporária neste navegador, sem envio e sem transcrição automática.</p><button class="secondary" data-action="enable-voice" style="margin-top:17px">Habilitar gravação local</button>`:`<button class="mic-button" id="mic-button" data-action="record" aria-label="Começar gravação">${icon('mic')}</button><p class="voice-label" id="voice-label">Toque para gravar.</p><p class="tiny">O microfone só fica ativo durante a gravação. Limite de 90 segundos. Você pode ouvir e apagar antes de continuar.</p><div id="audio-review">${currentAudio?audioReview():''}</div><p class="inline-error" id="voice-error" role="status"></p>`}</div>`;}
function audioReview(){return `<audio controls src="${currentAudio.url}" aria-label="Ouvir sua gravação"></audio><div class="record-tools"><button class="small-btn" data-action="discard-audio">Apagar áudio</button></div><p class="tiny">${currentAudio.duration}s de áudio. Transcrição ainda não conectada.<br>As próximas perguntas seguirão o roteiro da área escolhida.</p><button class="primary" data-action="submit-audio">Usar áudio e escolher carta <span class="arrow">→</span></button>`;}
function shuffleDeck(){const used=state.cards.map(c=>c.id);const available=DECK.filter(c=>!used.includes(c.id));for(let i=available.length-1;i>0;i--){const u=new Uint32Array(1);crypto.getRandomValues(u);const j=u[0]%(i+1);[available[i],available[j]]=[available[j],available[i]];}state.deck=available.slice(0,3);state.selected=null;}
function cardsScreen(){return `<div class="app-shell fade">${sessionTop(4,'Encontro com o símbolo')}<div class="cards-heading"><span class="eyebrow">Carta ${state.question+1} de 3</span><h1>${state.selected===null?'Uma pausa.<br>Uma escolha sua.':'Um símbolo para<br>olhar com calma.'}</h1><p>${state.selected===null?'Escolha uma das três cartas. Deixe que a imagem abra uma pergunta, sem exigir uma certeza.':'O sentido aparece no encontro entre o símbolo e a sua história.'}</p></div><div class="card-deck" aria-label="Três cartas para escolha">${state.deck.map((c,i)=>`<button class="tarot ${state.selected===i?'flipped':state.selected!==null?'dim':''}" data-action="pick-card" data-index="${i}" aria-label="${state.selected===i?esc(c.name):'Escolher carta '+(i+1)}" ${state.selected!==null?'disabled':''}><span class="card-inner"><span class="card-side card-back">${icon('back-art')}<small>ASSUMA</small></span><span class="card-side card-face" aria-hidden="${state.selected!==i}"><span class="roman">${c.roman}</span>${icon(c.art)}<span class="card-name">${c.name}</span></span></span></button>`).join('')}</div><div id="reveal" aria-live="polite">${state.selected===null?`<p class="card-number">01 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 02 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 03</p><p class="session-hint">Escolha simbólica de demonstração.<br>Sem previsão de acontecimentos ou leitura sobre terceiros.</p>`:revealContent()}</div></div>`;}
function revealContent(){const card=state.deck[state.selected];return `<div class="reveal fade"><h2>${card.name}</h2><p>${card.text}</p><button class="primary" data-action="next-question">${state.question===2?'Ver meu primeiro olhar':'Continuar a conversa'} <span class="arrow">→</span></button><p class="tiny">Sentido tradicional ilustrativo. Texto sujeito à revisão de Rarí.<br>A carta não confirma fatos nem determina seu caminho.</p></div>`;}
function reportData(){return {type:'ASSUMA — síntese demonstrativa',version:'0.1',generatedAt:new Date().toISOString(),area:AREAS[state.area].label,preferredName:state.name||'Não informado',answers:state.answers.map(a=>({question:a.question,type:a.type,text:a.type==='text'?a.text:null,audioDurationSeconds:a.type==='audio'?a.duration:null,transcriptionStatus:a.type==='audio'?'not_configured':'not_applicable'})),cards:state.cards.map(c=>({name:c.name,theme:c.theme,illustrativeText:c.text})),consent:{temporaryExperience:state.consent.experience,localVoice:state.consent.voice,shareWithRari:state.consent.share},manualVersion:null,aiConnected:false,sentToRari:false};}
function summary(){const audios=state.answers.filter(a=>a.type==='audio').length;return {opening:`Você escolheu olhar para ${AREAS[state.area].label.toLowerCase()}. Este primeiro registro reúne o que você trouxe e os símbolos escolhidos para uma conversa com Rarí.`,reflection:`As cartas escolhidas oferecem três temas para reflexão: ${state.cards.map(c=>c.theme).join(', ')}. Você pode investigar o que essas imagens acrescentam à sua reflexão sobre ${AREAS[state.area].focus}. Nenhuma delas permite concluir o que outra pessoa sente ou garantir um desfecho.`,audioNote:audios?`${audios} resposta(s) em áudio ficaram apenas neste navegador, sem transcrição ou interpretação. A cópia textual do relatório registra essa ausência; ela não inclui os arquivos de áudio.`:''};}
function reportScreen(){const s=summary();return `<div class="app-shell fade">${sessionTop(5,'Seu primeiro olhar')}<div class="report-intro"><span class="eyebrow">05 · Para levar com você</span><h1>${state.name?esc(state.name)+', seu':'Seu'} primeiro<br>olhar está aqui.</h1><p>${s.opening}</p></div><article class="report" id="report"><div class="report-head"><span class="eyebrow">ASSUMA · Registro inicial</span><span>Prévia demonstrativa</span></div><span class="eyebrow">${esc(AREAS[state.area].label)}</span><h2>O que você trouxe merece uma conversa.</h2><p>Este registro organiza suas respostas. A devolutiva simbólica é ilustrativa e aguarda o manual autoral de Rarí.</p><h3>Nas suas palavras</h3><blockquote>${state.answers[0].type==='text'?'“'+esc(state.answers[0].text)+'”':'Primeira resposta em áudio local, ainda sem transcrição.'}</blockquote><h3>Os símbolos do seu percurso</h3><div class="report-cards">${state.cards.map((c,i)=>`<div class="report-card"><small>Encontro 0${i+1}</small>${c.name}</div>`).join('')}</div><h3>Uma possibilidade de reflexão</h3><p>${s.reflection}</p><h3>Seu foco para a consulta</h3><blockquote>${state.answers[2].type==='text'?'“'+esc(state.answers[2].text)+'”':'Sua última resposta foi gravada em áudio, sem transcrição.'}</blockquote><h3>Para aprofundar com Rarí</h3><p>Na consulta, podemos investigar melhor a questão que você trouxe. Radiestesia e radiônica podem ser conversadas depois, conforme a avaliação de Rarí e a sua escolha.</p>${s.audioNote?`<div class="notice">${s.audioNote}</div>`:''}<details style="margin-top:23px"><summary style="cursor:pointer;font-size:12px;color:var(--muted)">Revisar minhas três respostas</summary>${state.answers.map((a,i)=>`<div class="qa"><strong>${i+1}. ${esc(a.question)}</strong><p>${a.type==='text'?esc(a.text):`Áudio local de ${a.duration}s · não transcrito`}</p>${a.type==='audio'?`<audio controls src="${a.url}" style="width:100%;height:35px;margin-top:10px"></audio>`:''}</div>`).join('')}</details><p class="tiny" style="font-size:10px;margin-top:24px">Registro simbólico, sem diagnóstico médico ou psicológico. Nenhum dado foi enviado a Rarí.</p></article><div class="report-actions"><button class="small-btn" data-action="download-report">↓ Baixar meu registro</button><button class="small-btn" data-action="copy-report">Copiar texto</button></div><section class="human-invite"><span class="eyebrow">O próximo encontro é humano</span><h2>Agora, a gente<br>olha junto.</h2><p>Você não precisa transformar tudo em uma pergunta perfeita. Leve o que apareceu para uma conversa comigo e conheça as possibilidades de consulta.</p><button class="primary" data-action="whatsapp">Continuar com Rarí no WhatsApp <span class="arrow">↗</span></button><p class="tiny">Você revisa o compartilhamento antes de continuar.<br>WhatsApp ainda não conectado nesta prévia.</p></section><button class="text-button clear-session" data-action="exit">Apagar esta experiência e voltar ao início</button></div>`;}
function render(){document.body.classList.toggle('app-view',state.screen!=='home');document.querySelector('.nav-links').style.display=state.screen==='home'?'':'none';document.querySelector('#main').innerHTML=({home,area:areaScreen,consent:consentScreen,conversation:conversationScreen,cards:cardsScreen,report:reportScreen}[state.screen]||home)();bindForms();}
function bindForms(){document.querySelector('#consent-experience')?.addEventListener('change',e=>{document.querySelector('#begin-session').disabled=!e.target.checked;});document.querySelector('#consent-form')?.addEventListener('submit',e=>{e.preventDefault();if(!document.querySelector('#consent-experience').checked)return;state.name=document.querySelector('#first-name').value.trim().slice(0,40);state.consent.experience=true;state.consent.voice=document.querySelector('#consent-voice').checked;track('consent_granted');voiceMode=state.consent.voice;go('conversation');});document.querySelector('#answer')?.addEventListener('input',e=>{state.draft=e.target.value;document.querySelector('#send-answer').disabled=!state.draft.trim();document.querySelector('#char-count').textContent=`${state.draft.length}/2400 · Só nesta aba`;});document.querySelector('#answer-form')?.addEventListener('submit',e=>{e.preventDefault();if(!state.draft.trim())return;submitAnswer({type:'text',text:state.draft.trim().slice(0,2400)});});document.querySelector('#share-check')?.addEventListener('change',e=>{state.consent.share=e.target.checked;const b=document.querySelector('#share-send');if(b)b.disabled=!e.target.checked||!validWhatsApp();});}
function submitAnswer(answer){stopRecording(false);const q=questionFor(state.question);state.answers.push({...answer,question:q.q});state.draft='';currentAudio=null;track('question_completed');shuffleDeck();go('cards');}
function pickCard(i){if(state.selected!==null||!Number.isInteger(i)||i<0||i>2)return;state.selected=i;state.cards.push(state.deck[i]);track('card_selected');const buttons=[...document.querySelectorAll('.tarot')];buttons.forEach((b,n)=>{b.disabled=true;b.classList.toggle('flipped',n===i);b.classList.toggle('dim',n!==i);if(n===i){b.setAttribute('aria-label',state.deck[i].name);b.querySelector('.card-face').setAttribute('aria-hidden','false');}});document.querySelector('.cards-heading h1').innerHTML='Um símbolo para<br>olhar com calma.';document.querySelector('.cards-heading p').textContent='O sentido aparece no encontro entre o símbolo e a sua história.';document.querySelector('#reveal').innerHTML=revealContent();}
function nextQuestion(){if(state.selected===null)return;if(state.question===2){track('experience_completed');go('report');}else{state.question++;go('conversation');}}
function showModal(title,html){document.querySelector('#modal-body').innerHTML=`<h2 id="modal-title">${title}</h2>${html}`;document.querySelector('#modal').showModal();bindForms();}
function privacyModal(){showModal('Sua história continua sua.',`<p>Esta é uma demonstração local do ASSUMA. Não há conta, banco de dados, IA externa, Pixel, cookie de marketing ou envio automático.</p><h3>Respostas escritas</h3><p>Ficam temporariamente na memória desta aba para montar o registro. Não são gravadas no armazenamento permanente do navegador. Recarregar, fechar a aba ou escolher “apagar experiência” descarta a sessão.</p><h3>Voz e transcrição</h3><p>O microfone depende de uma escolha opcional e de permissão do navegador. O áudio é gravado temporariamente aqui, pode ser reproduzido e apagado, e não é enviado. Não há transcrição automática. A leitura de perguntas usa somente uma voz marcada como local pelo dispositivo, se disponível.</p><h3>Compartilhamento</h3><p>Nenhum relatório é enviado nesta prévia. O botão do WhatsApp permite revisar o texto e autorizar o compartilhamento, mas o destinatário ainda precisa ser configurado. Se você baixar ou copiar o registro, terá uma cópia sob seu controle.</p><h3>Próxima versão</h3><p>Antes de conectar serviços reais, Rarí deverá aprovar o manual e os textos, definir responsáveis, finalidades, fornecedores, prazos de retenção, direitos de acesso e exclusão e o contato de privacidade. A política final será apresentada antes da coleta real.</p>`);}
function statusModal(){showModal('O que você pode testar.',`<div class="status-grid"><div>Jornada e cartas<small>Funcionais no navegador</small></div><div>Três perguntas<small>Roteiro simulado e adaptação por regras</small></div><div>Gravação de voz<small>Local, se o navegador permitir</small></div><div>Transcrição e IA<small>Ainda não conectadas</small></div><div>Relatório<small>Texto para revisar, copiar e baixar</small></div><div>WhatsApp Business<small>Ainda não configurado</small></div><div>Meta Pixel<small>Inativo · eventos locais de teste</small></div><div>Banco de dados<small>Sem armazenamento remoto</small></div></div><p style="margin-top:20px">Manual autoral: rascunho aguardando aprovação de Rarí. Nenhuma campanha, publicação ou integração externa foi ativada.</p><p class="tiny">Nesta sessão: ${state.events.length} eventos de teste em memória, sem respostas ou dados pessoais.</p>`);}
function termsModal(){showModal('Uma primeira versão, para sentir.',`<p>Esta prévia foi criada para Rarí avaliar a direção visual e testar a jornada no celular.</p><p>Os textos são propostas de primeira versão. As perguntas e sentidos simbólicos são ilustrativos; não representam um manual autoral aprovado ou uma leitura realizada por Rarí.</p><p>A agente de IA, a transcrição, a automação de WhatsApp e o rastreamento de anúncios ainda dependem de configuração. Não há compra, cobrança, agendamento ou promessa de resultado.</p>`);}
function reportText(){const s=summary();return `ASSUMA | PORTAL ORACULAR\nREGISTRO DEMONSTRATIVO — Rarí Fávaro\n\nÁrea: ${AREAS[state.area].label}\nComo ser chamado: ${state.name||'Não informado'}\n\n${s.opening}\n\nSUAS RESPOSTAS\n${state.answers.map((a,i)=>`${i+1}. ${a.question}\n${a.type==='text'?a.text:`[Áudio local, ${a.duration}s — sem transcrição e não incluído neste arquivo]`}`).join('\n\n')}\n\nSÍMBOLOS ESCOLHIDOS\n${state.cards.map(c=>`${c.name} — ${c.theme}\n${c.text}`).join('\n\n')}\n\nPOSSIBILIDADE DE REFLEXÃO\n${s.reflection}\n\nPARA A CONSULTA HUMANA\nAprofundar a situação relatada e combinar diretamente as possibilidades de atendimento com Rarí. Nenhum diagnóstico clínico ou protocolo energético foi produzido.\n\nSTATUS\nRoteiro demonstrativo. Manual autoral pendente. Sem IA ou transcrição conectadas. Nenhum relatório enviado automaticamente.\n${s.audioNote}`;}
function validWhatsApp(){return /^\d{10,15}$/.test(ASSUMA_CONFIG.whatsappNumber);}
function whatsappModal(){track('whatsapp_intent');state.consent.share=false;showModal('Vamos continuar com Rarí?',`<p>Revise o registro abaixo. Na versão conectada, você poderá abrir o WhatsApp com esse texto e decidir o envio no aplicativo.</p><pre>${esc(reportText())}</pre><label class="check-row"><input type="checkbox" id="share-check"><span>Autorizo compartilhar este registro com Rarí para conversar sobre uma consulta.<small>Escolha específica para este contato. Não autoriza campanhas de marketing.</small></span></label><div class="notice">${validWhatsApp()?'Ao continuar, o registro sairá desta aba e será aberto no WhatsApp. Você confirma o envio no aplicativo.':'Demonstração: falta configurar e verificar o WhatsApp de Rarí. Nenhuma mensagem será enviada.'}</div><button id="share-send" class="primary" data-action="send-whatsapp" disabled>Abrir WhatsApp com meu registro ↗</button><button class="secondary" data-action="copy-report">Copiar meu registro</button>`);}
async function copyText(value){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(value);}else{const t=document.createElement('textarea');t.value=value;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();const success=document.execCommand('copy');t.remove();if(!success)throw Error('copy');}toast('Registro copiado. Você escolhe com quem compartilhar.');}catch{toast('Não foi possível copiar aqui. Use “Baixar meu registro”.');}}
function downloadReport(){const blob=new Blob([reportText()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ASSUMA_meu_registro.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Seu registro foi preparado para baixar.');}
function discardAudio(){if(currentAudio?.url){URL.revokeObjectURL(currentAudio.url);objectUrls=objectUrls.filter(u=>u!==currentAudio.url);}currentAudio=null;}
function stopRecording(discard){recordingGeneration++;if(recordTimer){clearInterval(recordTimer);recordTimer=null;}if(recorder){if(discard){recorder.onstop=null;recorder.ondataavailable=null;}if(recorder.state!=='inactive')recorder.stop();if(discard)recorder=null;}if(discard)recordChunks=[];if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}recording=false;}
async function startRecording(){if(recording){stopRecording(false);return;}if(!state.consent.voice)return;const error=document.querySelector('#voice-error');if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){error.textContent='Este ambiente não permite gravar. Abra a prévia em um navegador compatível ou use a opção Escrever.';return;}const generation=++recordingGeneration;try{const incoming=await navigator.mediaDevices.getUserMedia({audio:true});if(generation!==recordingGeneration||state.screen!=='conversation'||!voiceMode){incoming.getTracks().forEach(t=>t.stop());return;}stream=incoming;discardAudio();recordChunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data);};const activeRecorder=recorder;recorder.onstop=()=>{if(state.screen!=='conversation'||!voiceMode)return;const blob=new Blob(recordChunks,{type:activeRecorder.mimeType||'audio/webm'});const url=URL.createObjectURL(blob);objectUrls.push(url);currentAudio={url,duration:Math.max(1,Math.round((Date.now()-recordStarted)/1000))};recorder=null;render();};recorder.start();recordStarted=Date.now();recording=true;error.textContent='';const b=document.querySelector('#mic-button');b.classList.add('recording');b.setAttribute('aria-label','Parar gravação');document.querySelector('#voice-label').textContent='Gravando · 00:00';document.querySelector('#audio-review').innerHTML='';recordTimer=setInterval(()=>{const secs=Math.round((Date.now()-recordStarted)/1000);const label=document.querySelector('#voice-label');if(label)label.textContent=`Gravando · ${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')} · toque para parar`;if(secs>=90)stopRecording(false);},500);}catch(err){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}recording=false;if(error&&document.contains(error))error.textContent=err.name==='NotAllowedError'?'O acesso ao microfone não foi permitido. Você pode liberar nas configurações do navegador ou continuar escrevendo.':'Não foi possível iniciar o microfone neste ambiente. Continue pela opção Escrever.';}}
function speakQuestion(){if(!('speechSynthesis' in window)){toast('Voz indisponível neste ambiente. A pergunta está escrita na tela.');return;}const local=speechSynthesis.getVoices().filter(v=>v.localService&&/^pt/i.test(v.lang));if(!local.length){toast('Não há uma voz local em português disponível. Você pode ler a pergunta na tela.');return;}speechSynthesis.cancel();const q=questionFor(state.question),u=new SpeechSynthesisUtterance(q.lead+' '+q.q);u.voice=local[0];u.lang='pt-BR';u.rate=.93;speechSynthesis.speak(u);}
function reset(){stopRecording(true);if('speechSynthesis' in window)speechSynthesis.cancel();objectUrls.forEach(u=>URL.revokeObjectURL(u));objectUrls=[];recordChunks=[];currentAudio=null;state=freshState();voiceMode=false;go('home');}
function back(){if(state.screen==='area')go('home');else if(state.screen==='consent')go('area');else if(state.screen==='conversation'&&state.question===0)go('consent');else if(state.screen==='cards'){const prior=state.answers.pop();state.draft=prior?.type==='text'?prior.text:'';if(state.selected!==null)state.cards.pop();state.selected=null;go('conversation');}else if(state.screen==='conversation'&&state.question>0){state.question--;state.deck=[...state.cards.slice(-1),...DECK.filter(c=>!state.cards.some(x=>x.id===c.id)).slice(0,2)];state.selected=0;go('cards');}else if(state.screen==='report'){state.question=2;state.deck=[state.cards[2],...DECK.filter(c=>!state.cards.some(x=>x.id===c.id)).slice(0,2)];state.selected=0;go('cards');}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;switch(a){case'start':track('experience_start');go('area');break;case'area':state.area=b.dataset.area;track('area_selected');go('consent');break;case'back':back();break;case'exit':showModal('Encerrar este encontro?',`<p>Suas respostas e gravações serão apagadas desta aba. Cópias que você já baixou ou copiou ficam sob seu controle.</p><button class="primary" data-action="reset">Apagar e voltar ao início</button><button class="secondary" data-action="close-modal">Continuar minha experiência</button>`);break;case'reset':document.querySelector('#modal').close();reset();break;case'privacy':privacyModal();break;case'terms':termsModal();break;case'status':statusModal();break;case'close-modal':document.querySelector('#modal').close();break;case'text-mode':stopRecording(true);voiceMode=false;render();break;case'voice-mode':voiceMode=true;render();break;case'enable-voice':state.consent.voice=true;render();break;case'record':startRecording();break;case'discard-audio':discardAudio();render();break;case'submit-audio':if(currentAudio)submitAnswer({type:'audio',url:currentAudio.url,duration:currentAudio.duration});break;case'listen':speakQuestion();break;case'pick-card':pickCard(Number(b.dataset.index));break;case'next-question':nextQuestion();break;case'download-report':downloadReport();break;case'copy-report':copyText(reportText());break;case'whatsapp':whatsappModal();break;case'send-whatsapp':if(state.consent.share&&validWhatsApp()){const url=`https://wa.me/${ASSUMA_CONFIG.whatsappNumber}?text=${encodeURIComponent(reportText())}`;window.open(url,'_blank','noopener,noreferrer');}break;}});
document.querySelector('#brand-home').addEventListener('click',e=>{e.preventDefault();if(state.screen==='home')window.scrollTo({top:0});else document.querySelector('[data-action="exit"]').click();});
document.querySelector('#modal').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(recording)stopRecording(false);if('speechSynthesis' in window)speechSynthesis.cancel();}});
window.addEventListener('pagehide',()=>{stopRecording(true);objectUrls.forEach(u=>URL.revokeObjectURL(u));objectUrls=[];recordChunks=[];currentAudio=null;state=freshState();});
window.addEventListener('pageshow',e=>{if(e.persisted)render();});
render();
})();
</script>
</body>
</html>
